[alembic]
# %(here)s = directory containing this file (backend/). Migrations live in backend/migrations/.
script_location = %(here)s/migrations
# DB URL is set at runtime from the DATABASE_URL environment variable in migrations/env.py
# (Do not use %(DATABASE_URL)s here — ConfigParser treats it as invalid interpolation.)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

